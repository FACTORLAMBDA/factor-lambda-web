<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel privado · Factor Lambda</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-factor-lambda.png">
<link rel="apple-touch-icon" sizes="1254x1254" href="/apple-touch-icon-centered.png?v=panel2">
<link rel="manifest" href="/panel.webmanifest"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-title" content="Factor Lambda"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="/panel-vip.css?v=1"><link rel="stylesheet" href="/panel-readable.css?v=1"><link rel="stylesheet" href="/panel-closures.css?v=closures1"><link rel="preload" as="image" href="/assets/panel-factor-lambda-logo.png"><link rel="preload" as="font" type="font/ttf" href="/assets/fonts/teko-500.ttf" crossorigin><link rel="stylesheet" href="/panel-agenda.css?v=calendar1"><link rel="stylesheet" href="/panel-brand.css?v=brand1"><link rel="stylesheet" href="/panel-type.css?v=workshop1"><script src="/panel-boot.js?v=brand1" defer></script></head><body>
<div id="panel-loader" class="panel-loader" hidden>
  <div class="loader-content">
    <div class="loader-logo" aria-hidden="true"><img id="loader-logo-base" src="/assets/panel-factor-lambda-logo.png" alt="" width="885" height="266"><img class="loader-logo-color" src="/assets/panel-factor-lambda-logo.png" alt="" width="885" height="266"></div>
    <div id="panel-progress" class="loader-progress" role="progressbar" aria-label="Cargando panel privado" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="loader-progress-track"><span id="loader-progress-fill"></span></span><span id="loader-percentage" aria-hidden="true">0%</span></div>
  </div>
</div>
<main id="panel-main">
<header class="panel-heading"><div class="panel-identity"><img class="panel-brand-logo" src="/assets/panel-factor-lambda-logo.png" alt="Factor Lambda" width="885" height="266"><div><h1>Panel privado</h1><span>taller@factorlambda.com</span></div></div><button id="admin-logout" type="button" hidden>Cerrar sesión</button></header>
<form id="admin-login"><h2>Acceso al taller</h2><label for="admin-password">Contraseña</label><input id="admin-password" type="password" required autocomplete="current-password"><button type="submit">Entrar</button></form><p id="admin-status" role="status"></p>
<section id="admin-workspace" hidden><nav class="panel-tabs" aria-label="Vistas del panel"><button id="tab-agenda" aria-pressed="true">Calendario</button><button id="tab-quotes" aria-pressed="false">Presupuestos</button></nav>
<section id="admin-agenda"><div class="agenda-toolbar"><button id="agenda-new" class="primary">+ Nueva cita</button><label>Ir a fecha<input id="agenda-jump" type="date"></label><button id="agenda-refresh" title="Actualizar calendario" aria-label="Actualizar calendario">&#8635;</button></div>
<div class="agenda-filters"><label>Calendario<select id="agenda-resource"><option value="all">Todo el taller</option><option value="repro">Reprogramaciones</option><option value="consult-joaquin">Joaquín · Consultas</option><option value="consult-german">Germán · Taller</option><option value="mechanics">Mecánica</option></select></label>
<label>Mecánico<select id="agenda-mechanic"><option value="all">Todos</option><option value="">Sin asignar</option><option value="german">Germán</option><option value="mazius">Mazius</option><option value="gerson">Gerson</option><option value="david">David</option></select></label>
<label>Estado<select id="agenda-filter"><option value="confirmed">Confirmadas</option><option value="unpaid">Sin pago</option><option value="all">Todos</option><option value="cancelled">Anuladas</option></select></label><label>Entorno<select id="agenda-mode"><option value="live">Real</option><option value="test">Pruebas</option></select></label><label>Buscar<input id="agenda-search" type="search" placeholder="Cliente, vehículo o referencia"></label></div>
<p id="agenda-status" role="status"></p><div id="agenda-totals"></div><div id="agenda-grid"></div><div class="calendar-legend"><span class="david">David</span><span class="german">Germán</span><span class="mazius">Mazius</span><span class="gerson">Gerson</span><span class="closed">Cerrado</span><span class="pending">Sin pago confirmado</span><span class="cancelled">Anulada</span><span id="agenda-sync"></span></div></section>
<section id="admin-quotes-view" hidden><button id="admin-refresh" type="button" hidden>Actualizar solicitudes</button><div id="admin-quotes"></div></section></section>
<dialog id="agenda-detail"><form id="calendar-form"><div class="detail-heading"><h2 id="calendar-dialog-title">Nueva cita</h2><button id="agenda-close" type="button" aria-label="Cerrar">&#215;</button></div><p id="calendar-state"></p><div class="event-fields">
<label class="wide">Título<input id="event-title" maxlength="160" required></label>
<label>Matrícula<input id="event-plate" maxlength="20" autocapitalize="characters"></label><label>Bastidor<input id="event-vin" maxlength="25" autocapitalize="characters" spellcheck="false"></label>
<label>Mecánico<select id="event-mechanic"><option value="">Sin asignar</option><option value="german">Germán</option><option value="mazius">Mazius</option><option value="gerson">Gerson</option><option value="david">David</option></select></label>
<label>Horas facturadas<input id="event-billed-hours" type="number" min="0" max="10000" step="0.01" inputmode="decimal" placeholder="Sin registrar"></label>
<label>Inicio · día y hora<input id="event-start" type="datetime-local" step="60" required></label><label>Final · día y hora<input id="event-end" type="datetime-local" step="60" required></label>
<label>Calendario<select id="event-resource"><option value="repro">Reprogramaciones</option><option value="consult-joaquin">Joaquín · Consultas</option><option value="consult-german">Germán · Taller</option><option value="mechanics">Mecánica</option></select></label><label>Cliente<input id="event-name" maxlength="120"></label><label>Teléfono<input id="event-phone" type="tel" maxlength="30"></label><label>Email<input id="event-email" type="email" maxlength="200"></label><label class="wide">Vehículo<input id="event-vehicle" maxlength="240"></label>
<label class="wide">Descripción<textarea id="event-notes" rows="5" maxlength="2000"></textarea></label>
</div><p id="event-payment"></p><div id="event-contact" class="event-contact"></div><p id="event-message" role="status"></p><div class="event-actions"><button id="event-cancel" type="button" class="danger">Anular cita</button><button id="event-save" type="submit" class="primary">Guardar cita</button></div></form></dialog>
</main><script src="/vendor/fullcalendar/luxon.js" defer></script><script src="/vendor/fullcalendar/calendar.js" defer></script><script src="/vendor/fullcalendar/madrid.js" defer></script><script src="/panel-closures.js?v=closures1" defer></script><script src="/panel-agenda.js?v=readable1" defer></script><script src="/panel-vip.js?v=1" defer></script><script src="/panel-presupuestos.js?v=vip1" defer></script></body></html>
