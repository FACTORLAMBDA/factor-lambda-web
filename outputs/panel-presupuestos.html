<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel privado · Factor Lambda</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="/citas.css"><link rel="stylesheet" href="/panel-agenda.css"></head><body><main>
<header class="panel-heading"><h1>Factor Lambda · Panel privado</h1><button id="admin-logout" type="button" hidden>Cerrar sesión</button></header>
<form id="admin-login"><label for="admin-password">Clave de acceso</label><input id="admin-password" type="password" required autocomplete="current-password"><div class="booking-navigation"><button type="submit">ACCEDER</button></div></form><p id="admin-status" role="status"></p>
<section id="admin-workspace" hidden><nav class="panel-tabs" aria-label="Vistas del panel"><button id="tab-agenda" aria-pressed="true">Agenda</button><button id="tab-quotes" aria-pressed="false">Presupuestos</button></nav>
<section id="admin-agenda"><div class="agenda-toolbar"><div class="week-controls"><button id="agenda-prev" title="Semana anterior" aria-label="Semana anterior">&#8592;</button><button id="agenda-today">Hoy</button><button id="agenda-next" title="Semana siguiente" aria-label="Semana siguiente">&#8594;</button></div><h2 id="agenda-range"></h2><button id="agenda-refresh">Actualizar</button></div>
<div class="agenda-filters"><label>Entorno<select id="agenda-mode"><option value="live">Cobros reales</option><option value="test">Pruebas</option></select></label><label>Estado<select id="agenda-filter"><option value="paid">Citas confirmadas y pagadas</option><option value="unpaid">Sin pago · Contactar</option><option value="all">Todos los registros</option><option value="pending">Retenciones sin pago confirmado</option><option value="released">Liberadas</option><option value="cancelled">Anuladas</option></select></label><label>Buscar<input id="agenda-search" type="search" placeholder="Cliente, coche o referencia"></label></div>
<p id="agenda-status" role="status"></p><div id="agenda-totals"></div><div id="agenda-grid"></div></section>
<section id="admin-quotes-view" hidden><button id="admin-refresh" type="button" hidden>Actualizar solicitudes</button><div id="admin-quotes"></div></section></section>
<dialog id="agenda-detail"><div class="detail-heading"><h2>Detalle de cita</h2><button id="agenda-close" aria-label="Cerrar detalle">&#215;</button></div><div id="agenda-detail-body"></div></dialog>
</main><script src="/booking-schedule.js" defer></script><script src="/consultation-policy.js" defer></script><script src="/panel-agenda.js?v=archive2" defer></script><script src="/panel-presupuestos.js?v=archive2" defer></script></body></html>
